<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOSS – Fraternal Order of the Seven Seas | Sail As One</title>
<meta name="description" content="The Fraternal Order of the Seven Seas (FOSS): a maritime brotherhood anchored in compassion, humility, integrity, and service. Est. Cebu, Philippines.">
<meta property="og:title" content="Order of the Seven Seas – Sail As One">
<meta property="og:description" content="A maritime brotherhood of principled leaders, anchored in service to humanity.">
<meta property="og:image" content="https://orderofthesevenseas.github.io/logo.jpg">
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--n9:#040f26;--n8:#071a3e;--n7:#0b2a63;--gold:#d4af5f;--gold-hi:#f3d98b;--gold-lo:#a98234;--ivory:#f7f4ec;--ink:#0c1b3a;--muted:#51607f;--serif:'Cinzel','Times New Roman',serif;--text:'Montserrat',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--text);color:var(--ink);background:var(--ivory);line-height:1.7;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
nav{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(4,15,38,.94);backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,.35);padding:8px 0}
.nav-in{max-width:1180px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;font-family:var(--serif);font-weight:700;letter-spacing:.14em}
.brand img{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
.links{margin-left:auto;display:flex;gap:26px;align-items:center}
.links a{color:#e8ecf7;text-decoration:none;font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.links a:hover{color:var(--gold-hi)}
.links .join{border:1.5px solid var(--gold);color:var(--gold-hi);padding:8px 18px;border-radius:40px}
.links .join:hover{background:var(--gold);color:var(--n9)}
.burger{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:120px 24px 90px;background:linear-gradient(180deg,rgba(4,15,38,.78),rgba(4,15,38,.9)),url('flag.jpg') center/cover no-repeat,radial-gradient(ellipse at 50% 30%,#123a82,var(--n7) 35%,var(--n8) 70%,var(--n9))}
.hero-in{max-width:820px}
.logo{width:clamp(180px,32vw,280px);height:clamp(180px,32vw,280px);margin:0 auto 28px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 4px rgba(212,175,95,.55),0 22px 60px rgba(0,0,0,.6)}
.eyebrow{font-weight:600;font-size:.78rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:clamp(2rem,6vw,4rem);line-height:1.1;letter-spacing:.06em;color:var(--gold-hi)}
.motto{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,3vw,1.9rem);margin:14px 0 18px;letter-spacing:.12em}
.sub{max-width:36em;margin:0 auto 32px;color:#d3dbef}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;padding:14px 30px;border-radius:50px;border:2px solid var(--gold);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--n9)}
.btn-line{color:var(--gold-hi)}
section{padding:90px 24px}
.wrap{max-width:1100px;margin:auto}
.head{text-align:center;margin-bottom:48px}
.head .eyebrow{color:var(--gold-lo)}
.head h2{font-family:var(--serif);font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.06em;color:var(--n8)}
.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:34px}
.intro{font-family:var(--serif);font-size:1.35rem;line-height:1.6;color:var(--n8)}
.mv{display:grid;gap:20px}
.panel{background:#fff;border-radius:16px;padding:26px 28px;border-top:4px solid var(--gold);box-shadow:0 14px 40px rgba(7,26,62,.1)}
.panel h3{font-family:var(--serif);letter-spacing:.12em;font-size:1rem;color:var(--gold-lo);margin-bottom:6px}
.panel p{color:var(--muted);font-size:.95rem}
.values{background:linear-gradient(180deg,var(--n8),var(--n9));color:#fff}
.values .head h2{color:#fff}.values .head .eyebrow{color:var(--gold-hi)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.vcard{text-align:center;padding:34px 22px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(212,175,95,.35)}
.vcard .ic{font-size:2rem;margin-bottom:10px}
.vcard h3{font-family:var(--serif);letter-spacing:.14em;color:var(--gold-hi);margin-bottom:6px}
.vcard p{color:#c6d0e8;font-size:.93rem}
.out-text{max-width:760px;margin:0 auto 50px;text-align:center}
.quote{background:var(--n8);color:#fff;border-radius:18px;padding:34px;border-left:6px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:1.4rem;line-height:1.45;margin-bottom:22px;text-align:left}
.out-p{color:var(--muted)}
.gal-title{font-family:var(--serif);text-align:center;letter-spacing:.1em;color:var(--n8);font-size:1.4rem;margin-bottom:24px}
.gallery
